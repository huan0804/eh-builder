<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="tSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="35%" stop-color="#5a3a28"/>
      <stop offset="70%" stop-color="#c97d4a"/>
      <stop offset="100%" stop-color="#e8a866"/>
    </linearGradient>
    <linearGradient id="tFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3a2c"/>
      <stop offset="100%" stop-color="#1c140e"/>
    </linearGradient>
    <radialGradient id="tSunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdca0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffdca0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tPillarShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f0b08"/>
      <stop offset="50%" stop-color="#2e2419"/>
      <stop offset="100%" stop-color="#0f0b08"/>
    </linearGradient>
  </defs>

  <!-- Bầu trời hoàng hôn nhìn qua cuối hành lang -->
  <rect width="1600" height="900" fill="#0f0b08"/>
  <rect x="550" y="0" width="500" height="620" fill="url(#tSky)"/>
  <circle cx="800" cy="420" r="220" fill="url(#tSunGlow)"/>
  <circle cx="800" cy="420" r="70" fill="#ffe4b0" opacity="0.9"/>

  <!-- Sàn hành lang phối cảnh -->
  <polygon points="0,900 1600,900 1000,620 600,620" fill="url(#tFloor)"/>
  <!-- vạch phối cảnh sàn -->
  <g stroke="#0f0b08" stroke-width="4" opacity="0.5">
    <line x1="200" y1="900" x2="700" y2="640"/>
    <line x1="500" y1="900" x2="760" y2="650"/>
    <line x1="1400" y1="900" x2="900" y2="640"/>
    <line x1="1100" y1="900" x2="840" y2="650"/>
  </g>

  <!-- Trần hành lang -->
  <polygon points="0,0 1600,0 1000,180 600,180" fill="#1c140e"/>

  <!-- Cột hành lang hai bên, phối cảnh thu nhỏ dần -->
  <g>
    <rect x="20" y="180" width="90" height="720" fill="url(#tPillarShade)"/>
    <rect x="230" y="260" width="60" height="560" fill="url(#tPillarShade)"/>
    <rect x="400" y="340" width="40" height="420" fill="url(#tPillarShade)"/>
    <rect x="1490" y="180" width="90" height="720" fill="url(#tPillarShade)"/>
    <rect x="1310" y="260" width="60" height="560" fill="url(#tPillarShade)"/>
    <rect x="1160" y="340" width="40" height="420" fill="url(#tPillarShade)"/>
  </g>

  <!-- Cửa sổ hắt sáng dọc hành lang -->
  <g opacity="0.5">
    <rect x="130" y="300" width="80" height="260" fill="#e8a866"/>
    <rect x="1390" y="300" width="80" height="260" fill="#e8a866"/>
  </g>

  <!-- Bàn để máy quay ở tiền cảnh, hơi mờ (bokeh nhẹ) -->
  <g opacity="0.9">
    <rect x="120" y="760" width="260" height="20" fill="#1c140e"/>
    <rect x="150" y="700" width="14" height="60" fill="#1c140e"/>
    <rect x="330" y="700" width="14" height="60" fill="#1c140e"/>
    <g transform="translate(180,650)" opacity="0.95">
      <rect x="0" y="10" width="110" height="60" rx="8" fill="#151515"/>
      <circle cx="8" cy="40" r="26" fill="#0b0b0b"/>
      <circle cx="8" cy="40" r="14" fill="#3a3a3a"/>
      <rect x="100" y="20" width="34" height="18" rx="3" fill="#0b0b0b"/>
    </g>
  </g>
  <!-- làm mờ vùng máy quay tiền cảnh bằng lớp phủ nhẹ -->
  <rect x="100" y="600" width="320" height="220" fill="#0f0b08" opacity="0.15"/>

  <!-- Vệt sáng khói/bụi trong không khí -->
  <g opacity="0.12">
    <ellipse cx="800" cy="500" rx="500" ry="180" fill="#ffdca0"/>
  </g>

  <!-- Vignette -->
  <radialGradient id="tVignette" cx="50%" cy="45%" r="75%">
    <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#tVignette)"/>
</svg>
